<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soft Mathematical Encouragement Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #12151b;
      --card-bg: #1c212b;
      --border-soft: rgba(186, 230, 253, 0.22);
      --powder-blue: #bae6fd;
      --accent-periwinkle: #a5b4fc;
      --glow-blue: rgba(186, 230, 253, 0.12);
      --text-main: #f0f6ff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
      overflow: hidden;
    }

    .widget-container {
      position: relative;
      background: linear-gradient(145deg, #1d222e 0%, #171b24 100%);
      border: 1px solid var(--border-soft);
      border-radius: 24px;
      padding: 26px 24px 22px;
      width: 330px;
      text-align: center;
      box-shadow: 
        0 12px 32px rgba(0, 0, 0, 0.45),
        0 0 20px var(--glow-blue);
    }

    /* Floating soft math symbols */
    .math-symbol {
      position: absolute;
      color: rgba(186, 230, 253, 0.08);
      font-family: 'Playfair Display', serif;
      font-style: italic;
      user-select: none;
      pointer-events: none;
    }

    .header-tag {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: var(--powder-blue);
      text-transform: uppercase;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      opacity: 0.9;
    }

    .message-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(186, 230, 253, 0.08);
      border-radius: 16px;
      padding: 16px 14px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .main-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 500;
      line-height: 1.45;
      color: #f8fafc;
      transition: all 0.3s ease;
    }

    .sub-text {
      font-size: 0.78rem;
      color: var(--accent-periwinkle);
      margin-top: 6px;
      font-style: italic;
      opacity: 0.9;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-soft), transparent);
      margin-bottom: 18px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(186, 230, 253, 0.06);
      color: var(--powder-blue);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      background: var(--powder-blue);
      color: #0f172a;
      box-shadow: 0 4px 15px rgba(186, 230, 253, 0.25);
      transform: translateY(-1px);
    }

    .btn-soft {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .btn-soft:hover {
      background: rgba(244, 114, 182, 0.15);
      color: #fbcfe8;
      border-color: rgba(244, 114, 182, 0.3);
      box-shadow: 0 4px 15px rgba(244, 114, 182, 0.15);
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- Soft Math Symbols -->
    <span class="math-symbol" style="top: 12px; left: 16px; font-size: 1.6rem;">&sum;</span>
    <span class="math-symbol" style="bottom: 12px; right: 18px; font-size: 1.8rem;">&int;</span>
    <span class="math-symbol" style="top: 38px; right: 16px; font-size: 1.2rem;">&forall; x</span>

    <div class="header-tag">
      <span>✦</span> RO &bull; study place <span>✦</span>
    </div>

    <div class="message-card">
      <div class="main-text" id="mainText">You are doing your best.</div>
      <div class="sub-text" id="subText">trust the process &amp; step by step 𓍢ִ໋🌷</div>
    </div>

    <div class="divider"></div>

    <div class="btn-group" id="btnGroup">
      <button class="btn" onclick="handleChoice('yes')">Yes, I am! ✧</button>
      <button class="btn btn-soft" onclick="handleChoice('no')">I feel like I can't</button>
    </div>
  </div>

  <script>
    const girlyPositiveMessages = [
      { main: "You can do it, girl! 𓍢ִ໋🌊", sub: "optimal solution lies ahead • Q.E.D. ∎" },
      { main: "Trust the process, darling. ☁️", sub: "good things take time & grace" },
      { main: "Big things are coming for you ✨", sub: "you're built for this moment" }
    ];

    let choiceIndex = 0;

    function handleChoice(type) {
      const mainText = document.getElementById('mainText');
      const subText = document.getElementById('subText');
      const btnGroup = document.getElementById('btnGroup');

      if (type === 'no') {
        mainText.style.color = '#fbcfe8';
        mainText.textContent = "Giving up isn't an option 🫧";
        subText.style.color = '#a5b4fc';
        subText.textContent = "take a deep breath, you've got this sweetie";
        
        btnGroup.innerHTML = `
          <button class="btn" style="width:100%" onclick="resetWidget()">Let's try again 🤍</button>
        `;
      } else {
        const current = girlyPositiveMessages[choiceIndex % girlyPositiveMessages.length];
        choiceIndex++;
        
        mainText.style.color = '#bae6fd';
        mainText.textContent = current.main;
        subText.style.color = '#a5b4fc';
        subText.textContent = current.sub;

        btnGroup.innerHTML = `
          <button class="btn" style="width:100%" onclick="resetWidget()">Keep going, girl ✦</button>
        `;
      }
    }

    function resetWidget() {
      const mainText = document.getElementById('mainText');
      const subText = document.getElementById('subText');
      const btnGroup = document.getElementById('btnGroup');

      mainText.style.color = '#f8fafc';
      mainText.textContent = "You are doing your best.";
      subText.style.color = '#a5b4fc';
      subText.textContent = "trust the process & step by step 𓍢ִ໋🌷";

      btnGroup.innerHTML = `
        <button class="btn" onclick="handleChoice('yes')">Yes, I am! ✧</button>
        <button class="btn btn-soft" onclick="handleChoice('no')">I feel like I can't</button>
      `;
    }
  </script>

</body>
</html>
